# Delta Decompiler + Executor Dylib
# XcodeGen project specification
#
# Generates an iOS arm64 dylib (libDeltaDecompiler.dylib) containing:
#  - Luau decompiler (Rust luau-lifter via C FFI bridge)
#  - HTTP networking (cpp-httplib + ixwebsocket + OpenSSL)
#  - Protected executor API registration table
#  - iOS integration layer (ObjC class registration + lifecycle observer)
#
# Build with:
#   xcodegen generate
#   xcodebuild -project DeltaDecompiler.xcodeproj \
#              -scheme DeltaDecompiler \
#              -configuration Release \
#              -destination 'generic/platform=iOS' \
#              build
#
# Or for simulator:
#   xcodebuild ... -destination 'generic/platform=iOS Simulator'

name: DeltaDecompiler
options:
  bundleIdPrefix: com.delta
  deploymentTarget:
    iOS: "12.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: c17
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    ENABLE_BITCODE: NO
    ENABLE_STRICT_OBJC_MSGSEND: NO
    LLVM_ENABLE_MODULES: YES
    ONLY_ACTIVE_ARCH: NO
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    CURRENT_PROJECT_VERSION: "1.0.0"
    MARKETING_VERSION: "1.0.0"

targets:
  DeltaDecompiler:
    type: dynamicLibrary
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources/delta_decompiler
        type: group
    settings:
      base:
        PRODUCT_NAME: DeltaDecompiler
        PRODUCT_BUNDLE_IDENTIFIER: com.delta.executor
        INFOPLIST_FILE: Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "-lstdc++"
          - "-lc++"
        DEFINES:
          - "DELTA_DECOMPILE_DYLIB=1"
        # When building with full networking stack (macOS runner with
        # cpp-httplib, ixwebsocket, OpenSSL available):
        #   add -DUSE_CPHTTPLIB -DUSE_IXWEBSOCKET -DUSE_OPENSSL
        #   and link against the static libraries.
        #
        # For iOS device builds, the libraries must be cross-compiled
        # for arm64-apple-ios first.
        #
        # For simulator builds, use the macOS versions of the libraries.
    preBuildScripts: []
    postBuildScripts: []

  DeltaDecompiler-Sim:
    type: dynamicLibrary
    platform: iOS Simulator
    deploymentTarget: "12.0"
    sources:
      - path: Sources/delta_decompiler
        type: group
    settings:
      base:
        PRODUCT_NAME: DeltaDecompilerSim
        PRODUCT_BUNDLE_IDENTIFIER: com.delta.executor.sim
        INFOPLIST_FILE: Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "-lstdc++"
          - "-lc++"
        DEFINES:
          - "DELTA_DECOMPILE_DYLIB=1"
          - "DELTA_SIMULATOR=1"
