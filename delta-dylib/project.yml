name: DeltaDecompiler
options:
  bundleIdPrefix: com.delta
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: DeltaDecompiler
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    ENABLE_BITCODE: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"

packages:
  LuauLifter:
    type: local
    path: delta-rust
    explicitFileType: archive

targets:
  DeltaDecompiler:
    type: dynamicFramework
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/delta_decompiler
        type: group
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: "arm64"
        VALID_ARCHS: "arm64"
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited)"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/../delta-rust/target/aarch64-apple-ios/release"
          - "-lluau_lifter"
          - "-force_load $(SRCROOT)/../delta-rust/target/aarch64-apple-ios/release/libluau_lifter.a"
          - "-lc++"
          - "-lstdc++"
        COMBINE_HIDPI_IMAGES: YES
    preBuildScripts: []
    postBuildScripts: []

schemes:
  DeltaDecompiler:
    build:
      targets:
        DeltaDecompiler: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
