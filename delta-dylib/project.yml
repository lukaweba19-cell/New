name: libDeltaDecompiler
options:
  bundleIdPrefix: com.delta.executor
  deploymentTarget:
    iOS: "12.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "2.743.1136"
    CURRENT_PROJECT_VERSION: "1136"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    ZIP_STRUCTURE: YES

targets:
  libDeltaDecompiler:
    type: dynamicFramework
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources/reconstructed
        buildPhase: sources
      - path: Resources/assets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: libDeltaDecompiler
        PRODUCT_BUNDLE_IDENTIFIER: com.delta.executor.dylib
        DYLIB_INSTALL_NAME_BASE: @rpath
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        CLANG_ENABLE_OBJC_ARC: YES
        MTL_FAST_MATH: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_FRAMEWORK_SEARCH_PATHS: "$(inherited)"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: "DeltaDecompiler"
        CFBundleDisplayName: "Delta Decompiler"
        CFBundleIdentifier: "com.delta.executor.dylib"
        CFBundleVersion: "1136"
        CFBundleShortVersionString: "2.743.1136"
        CFBundlePackageType: "FMWK"
        CFBundleExecutable: "libDeltaDecompiler"
        CFBundleSignature: "????"
        CFBundleDevelopmentRegion: "en"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: "LaunchScreen"
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight


