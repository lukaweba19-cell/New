name: Build libDeltaDecompiler.dylib

on:
  push:
    branches:
      - main
      - freebuff/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('delta-dylib/delta-rust/medal-baseline/Cargo.lock') }}
          restore-keys: cargo-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Xcode command line tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version || true
          clang --version || true

      - name: Build Rust static library (iOS arm64)
        run: |
          cd delta-dylib/delta-rust/medal-baseline
          echo "=== PATH ===" && echo "$PATH"
          echo "=== which cargo/rustc ===" && which cargo && which rustc
          echo "=== rustc version ===" && rustc --version
          echo "=== cargo version ===" && cargo --version
          echo "=== rustup show ===" && rustup show
          echo "=== installed targets ===" && rustup target list --installed
          echo "=== cargo check ===" && cargo check --target aarch64-apple-ios -p luau-lifter 2>&1; echo "cargo check exit: $?"
          echo "=== cargo build ===" && cargo build --release --lib --target aarch64-apple-ios -p luau-lifter 2>&1; echo "cargo build exit: $?"
          LIB=$(find target -name "libluau_lifter.a" -type f | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libluau_lifter.a not found"
            exit 1
          fi
          echo "Found: $LIB"
          ls -lh "$LIB"

      - name: Generate Xcode project
        working-directory: delta-dylib
        run: xcodegen generate

      - name: Build iOS dylib
        working-directory: delta-dylib
        run: |
          xcodebuild archive \
            -project libDeltaDecompiler.xcodeproj \
            -scheme libDeltaDecompiler \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/libDeltaDecompiler.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libDeltaDecompiler-dylib
          path: delta-dylib/build/libDeltaDecompiler.xcarchive/
          retention-days: 30
